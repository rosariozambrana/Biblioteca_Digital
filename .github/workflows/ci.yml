# CI — corre en cada PR y push a develop.
#
# Tiene 2 jobs corriendo en paralelo:
#   1. build       → lint + compila + tests de microservicios
#   2. security    → escaneo de vulnerabilidades, secretos e IaC

name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  build:
    name: Lint, build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build catalog
        run: npm run build:catalog

      - name: Build loans
        run: npm run build:loans

      - name: Build notifications
        run: npm run build:notifications

      - name: Test
        run: npm test -- --passWithNoTests

  security:
    name: Security scans
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Escaneo de secretos
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependencias
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # Escaneo de vulnerabilidades
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      # Escaneo Terraform
      - name: tfsec scan
        uses: aquasecurity/tfsec-action@1
        with:
          working_directory: terraform/option-b-ecs
          soft_fail: true