# CI — corre en cada PR y push a develop.
#
# Tiene 2 jobs corriendo en paralelo:
#   1. build       → lint + compila + tests de microservicios
#   2. security    → escaneo de vulnerabilidades, secretos e IaC
#
# Ambos deben pasar antes de mergear a develop.
name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  build:
    name: Lint, build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 🔹 Adaptado: build de microservicios de biblioteca-digital
      - name: Build catalog
        run: npm run build:catalog

      - name: Build loans
        run: npm run build:loans

      - name: Build notifications
        run: npm run build:notifications

      - name: Test
        run: npm test -- --passWithNoTests

  # ---------------------------------------------------------------------------
  # Job de seguridad — DevSecOps "shift-left": en vez de descubrir problemas
  # en producción, los encontramos antes de mergear.
  #
  # 4 herramientas, cada una mira una capa distinta:
  #   - Gitleaks  → secretos commiteados (API keys, passwords, tokens)
  #   - npm audit → vulnerabilidades conocidas en dependencias
  #   - Trivy     → vulnerabilidades en filesystem + Dockerfiles (CVEs)
  #   - tfsec     → misconfiguraciones de Terraform (buckets públicos, etc.)
  # ---------------------------------------------------------------------------
  security:
    name: Security scans
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Secretos en el repo (claves AWS, tokens, etc.).
      - name: Gitleaks — scan secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Vulnerabilidades en dependencias de npm.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # 3. CVEs en filesystem + Dockerfiles.
      - name: Trivy — scan filesystem
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table

      # 4. Misconfiguraciones en Terraform (IaC security).
      - name: tfsec — scan Terraform
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/option-b-ecs
          soft_fail: true
